version: '3.8'

services:
  # 1. In-Memory Cache (Blazing fast querying)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # 2. Our Python High-Throughput Broker
  fastapi_ingestion:
    build: .
    ports:
      - "8001:8001"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
